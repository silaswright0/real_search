name: real-search

networks:
  default:
  search:
    name: real-search_search
    internal: true
  sandbox:
    name: real-search_sandbox
    internal: true
  sandbox-admin-net:
    name: real-search_sandbox-admin
    internal: true
  p2p:
    name: real-search_p2p
    internal: true

services:
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - valkey-data:/data
    networks:
      - search
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  tor:
    build:
      context: ./tor
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - tor-data:/var/lib/tor
    networks:
      - default
      - search
      - sandbox
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-dev-only-change-me-real-search}
      - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
      - FORCE_OWNERSHIP=true
    networks:
      - search
    depends_on:
      valkey:
        condition: service_healthy
      tor:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  yacy:
    image: docker.io/yacy/yacy_search_server:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - YACY_NETWORK=robinson
    volumes:
      - yacy-data:/opt/yacy_search_server/DATA
    networks:
      - p2p
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8090'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

  yacy-init:
    image: docker.io/curlimages/curl:8.11.1
    restart: on-failure
    mem_limit: 128m
    user: "0"
    environment:
      - YACY_URL=http://yacy:8090
      - YACY_ADMIN_USER=${YACY_ADMIN_USER:-admin}
      - YACY_ADMIN_PASSWORD=${YACY_ADMIN_PASSWORD:-docker}
    volumes:
      - ./yacy/init.sh:/init.sh:ro
    networks:
      - p2p
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      yacy:
        condition: service_healthy

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - qdrant-data:/qdrant/storage

  qdrant-init:
    image: docker.io/curlimages/curl:8.11.1
    restart: on-failure
    mem_limit: 128m
    user: "0"
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./qdrant/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      - qdrant

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - SEARXNG_URL=http://searxng:8080
      - YACY_URL=http://yacy:8090
      - YACY_RESOURCE=${YACY_RESOURCE:-local}
      - QDRANT_URL=http://qdrant:6333
      - CLICK_BROKER_URL=http://click-broker:8080
      - CLICK_BROKER_TOKEN=${CLICK_BROKER_TOKEN:?set CLICK_BROKER_TOKEN in .env}
    networks:
      - default
      - search
      - p2p
    depends_on:
      - searxng
      - yacy
      - qdrant
      - click-broker

  browser-sandbox:
    image: real-search-browser:local
    build:
      context: ./browser-sandbox
    entrypoint: ["true"]
    restart: "no"
    runtime: runsc
    mem_limit: 1g
    network_mode: none

  sockfilter:
    build:
      context: ./sockfilter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - BROWSER_IMAGE=real-search-browser:local
      - SANDBOX_NETWORK=real-search_sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox-admin-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2375/_ping')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      browser-sandbox:
        condition: service_completed_successfully

  click-broker:
    build:
      context: ./click-broker
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - DOCKER_HOST=tcp://sockfilter:2375
      - BROWSER_IMAGE=real-search-browser:local
      - SANDBOX_NETWORK=real-search_sandbox
      - TOR_HOST=tor
      - DOCKER_TLS_VERIFY=0
      - SANDBOX_RUNTIME=runsc
      - CLICK_BROKER_TOKEN=${CLICK_BROKER_TOKEN:?set CLICK_BROKER_TOKEN in .env}
      - HEARTBEAT_TIMEOUT_SEC=45
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - sandbox
      - sandbox-admin-net
    depends_on:
      sockfilter:
        condition: service_healthy
      tor:
        condition: service_healthy

  gateway:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      - CLICK_BROKER_TOKEN=${CLICK_BROKER_TOKEN:?set CLICK_BROKER_TOKEN in .env}
      - NGINX_ENVSUBST_FILTER=CLICK_BROKER_TOKEN
    depends_on:
      - web
      - click-broker

volumes:
  valkey-data:
  tor-data:
  yacy-data:
  qdrant-data:
