map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $cookie_real_search_vnc $vnc_cookie_valid {
    default 0;
    "~^[A-Za-z0-9_-]{43}$" 1;
}

map $http_upgrade $websocket_upgrade {
    default 0;
    ~*^websocket$ 1;
}

map $http_host $allowed_host {
    default 0;
    ~*^127\.0\.0\.1(:3000)?$ 1;
    ~*^localhost(:3000)?$ 1;
}

# Missing X-Forwarded-Host must allow. A quoted empty map key is ignored by
# nginx, so every request used to hit default 0 and return 444 (empty reply).
map $http_x_forwarded_host $allowed_forwarded_host {
    default 1;
    ~*^127\.0\.0\.1(:3000)?$ 1;
    ~*^localhost(:3000)?$ 1;
    ~. 0;
}

limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=search_rate:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=secure_open_rate:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=local_concurrency:10m;

server {
    listen 3000;
    server_name 127.0.0.1 localhost;
    access_log off;
    client_max_body_size 16k;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    if ($allowed_host = 0) {
        return 444;
    }

    if ($allowed_forwarded_host = 0) {
        return 444;
    }

    location ~ "^/click-broker/sessions/[a-f0-9]{32}/vnc/websockify$" {
        limit_conn local_concurrency 4;
        if ($vnc_cookie_valid = 0) {
            return 401;
        }
        if ($websocket_upgrade = 0) {
            return 426;
        }
        set $args "token=$cookie_real_search_vnc";
        rewrite ^/click-broker/(.*)$ /$1 break;
        proxy_pass http://172.31.0.4:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Click-Broker-Token "${CLICK_BROKER_TOKEN}";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /click-broker/ {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=login_rate burst=2 nodelay;
        limit_conn local_concurrency 2;
        proxy_pass http://172.31.0.3:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/search {
        limit_req zone=search_rate burst=10 nodelay;
        limit_conn local_concurrency 8;
        proxy_pass http://172.31.0.3:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/api/secure-open(?:/[a-f0-9]{32})?$" {
        limit_req zone=secure_open_rate burst=2 nodelay;
        limit_conn local_concurrency 3;
        proxy_pass http://172.31.0.3:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://172.31.0.3:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
