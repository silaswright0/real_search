map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $cookie_real_search_vnc $vnc_cookie_valid {
    default 0;
    "~^[A-Za-z0-9_-]{43}$" 1;
}

map $http_upgrade $websocket_upgrade {
    default 0;
    ~*^websocket$ 1;
}

server {
    listen 3000;
    access_log off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ~ "^/click-broker/sessions/[a-f0-9]{32}/vnc/websockify$" {
        if ($vnc_cookie_valid = 0) {
            return 401;
        }
        if ($websocket_upgrade = 0) {
            return 426;
        }
        set $args "token=$cookie_real_search_vnc";
        rewrite ^/click-broker/(.*)$ /$1 break;
        proxy_pass http://click-broker:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Click-Broker-Token "${CLICK_BROKER_TOKEN}";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /click-broker/ {
        return 404;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
