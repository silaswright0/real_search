# SearXNG settings — JSON API, outbound via Tor SOCKS.
# https://docs.searxng.org/admin/settings/settings.html

use_default_settings:
  engines:
    # Wikidata is not listed: its SPARQL init gets HTTP 403 through Tor and
    # the engine is then unregistered. It also only produces an infobox.
    keep_only:
      - duckduckgo
      - brave
      - startpage
      - mojeek
      - mwmbl
      - wiby
      - encyclosearch
      - searchmysite
      - wikipedia

general:
  instance_name: "real search"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  # Overwritten by ${SEARXNG_SECRET}
  secret_key: "dev-only-change-me-real-search"
  limiter: false
  image_proxy: false
  method: "POST"

# keep_only does not flip an engine's disabled flag or its display type.
engines:
  - name: wikipedia
    # The default is infobox-only. This UI renders the normal result list.
    display_type: ["list"]
  - name: mojeek
    disabled: false
    timeout: 15.0
  - name: startpage
    timeout: 15.0
  # Independent indexes with no API key. They return ordinary url/title hits
  # and do not use the bot blockers that refuse Tor exits.
  - name: mwmbl
    disabled: false
    timeout: 15.0
  - name: wiby
    disabled: false
    timeout: 15.0
  - name: encyclosearch
    disabled: false
    timeout: 15.0
  - name: searchmysite
    disabled: false
    timeout: 15.0

valkey:
  # Overwritten by ${SEARXNG_VALKEY_URL}, which must include the Valkey password.
  url: valkey://:must-be-overridden-by-SEARXNG_VALKEY_URL@valkey:6379/0

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
  extra_proxy_timeout: 10
  using_tor_proxy: true
  # New SOCKS connections only: the Tor auth gate mints unique
  # IsolateSOCKSAuth credentials per connection, which is the per-query circuit.
  enable_http2: false
  pool_connections: 8
  # Parallel one-shot SOCKS connections. keepalive_expiry stays 0 so a
  # connection is not reused; the gate still mints a circuit per connection.
  pool_maxsize: 8
  keepalive_expiry: 0.0
  proxies:
    all://: socks5h://searxng:circuit-isolation@172.28.0.2:9050
